<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Skyline de Toronto au coucher du soleil">
<defs>
<linearGradient id="skyT" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#3b2a63"/><stop offset="0.5" stop-color="#a1497f"/><stop offset="1" stop-color="#f0885a"/>
</linearGradient></defs>

<rect width="800" height="500" fill="url(#skyT)"/>
<circle cx="400" cy="300" r="90" fill="#ffd9a0" opacity="0.9"/>
<rect y="330" width="800" height="170" fill="#f2b17d" opacity="0.25"/>
<!-- skyline -->
<g fill="#241a3d">
  <rect x="120" y="230" width="40" height="170"/>
  <rect x="170" y="270" width="30" height="130"/>
  <rect x="210" y="200" width="46" height="200"/>
  <rect x="270" y="250" width="34" height="150"/>
  <!-- CN tower -->
  <rect x="360" y="90" width="16" height="310"/>
  <path d="M360 150 h16 l10 34 h-36 z" transform="translate(-4 0)"/>
  <rect x="356" y="70" width="24" height="34" rx="4"/>
  <rect x="365" y="30" width="6" height="44"/>
  <rect x="440" y="240" width="40" height="160"/>
  <rect x="490" y="200" width="34" height="200"/>
  <rect x="530" y="270" width="30" height="130"/>
  <rect x="566" y="230" width="44" height="170"/>
  <rect x="620" y="260" width="34" height="140"/>
</g>
<rect y="392" width="800" height="14" fill="#141024"/>
<g fill="#ffd27a" opacity="0.8">
  <rect x="130" y="250" width="6" height="8"/><rect x="146" y="280" width="6" height="8"/>
  <rect x="222" y="230" width="6" height="8"/><rect x="238" y="270" width="6" height="8"/>
  <rect x="452" y="270" width="6" height="8"/><rect x="500" y="240" width="6" height="8"/>
  <rect x="578" y="260" width="6" height="8"/>
</g>
</svg>