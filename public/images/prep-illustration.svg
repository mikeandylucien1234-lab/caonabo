<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Passager et check-in">
<defs>
<linearGradient id="bagP" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7c4dd0"/><stop offset="1" stop-color="#5b21b6"/></linearGradient></defs>

<rect width="800" height="500" fill="none"/>
<!-- boarding pass -->
<g transform="translate(150 120) rotate(-8)">
  <rect x="0" y="0" width="360" height="180" rx="18" fill="#efe9fb"/>
  <rect x="0" y="0" width="360" height="46" rx="18" fill="#5b21b6"/>
  <rect x="0" y="30" width="360" height="16" fill="#5b21b6"/>
  <circle cx="24" cy="23" r="9" fill="#c9b6ef"/>
  <rect x="40" y="16" width="150" height="14" rx="7" fill="#c9b6ef"/>
  <rect x="30" y="74" width="120" height="14" rx="7" fill="#b9a4e6"/>
  <rect x="30" y="100" width="200" height="12" rx="6" fill="#ccbcee"/>
  <rect x="30" y="122" width="160" height="12" rx="6" fill="#ccbcee"/>
  <line x1="270" y1="16" x2="270" y2="164" stroke="#b9a4e6" stroke-dasharray="6 6" stroke-width="3"/>
  <g transform="translate(292 70)"><path d="M0 8 l40 -8 l4 6 l-30 10 l14 20 l-10 3 l-24 -18 l-16 5 l-4 -8 z" fill="#5b21b6"/></g>
</g>
<!-- suitcase -->
<g transform="translate(430 210)">
  <rect x="-14" y="-34" width="60" height="26" rx="10" fill="none" stroke="#5b21b6" stroke-width="8"/>
  <rect x="-40" y="-8" width="112" height="150" rx="18" fill="url(#bagP)"/>
  <rect x="-18" y="-8" width="16" height="150" fill="#4a1a97" opacity="0.5"/>
  <rect x="24" y="-8" width="10" height="150" fill="#7a4bcb" opacity="0.6"/>
  <rect x="-40" y="26" width="112" height="10" fill="#3f1585"/>
  <circle cx="-24" cy="158" r="9" fill="#2f1266"/><circle cx="56" cy="158" r="9" fill="#2f1266"/>
</g>
</svg>